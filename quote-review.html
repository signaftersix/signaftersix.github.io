<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Revised Quote | Sign After Six</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/styles.css"></head><body><header class="site-header"><div class="wrap nav-wrap"><a class="brand" href="index.html"><span><strong>Sign After Six</strong><small>Mobile Notary</small></span></a></div></header><main class="section"><div class="wrap narrow"><div class="admin-login" style="background:white;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)"><div class="eyebrow">Revised quote</div><h1 style="font-size:clamp(2.5rem,6vw,4rem)">Review the updated price</h1><div id="quoteReview"><p>Loading secure quote…</p></div></div></div></main><script src="config.js"></script><script>
(async()=>{const box=document.getElementById('quoteReview'),cfg=window.SAS_CONFIG||{},p=new URLSearchParams(location.search),requestId=p.get('request'),token=p.get('token');if(!cfg.API_BASE_URL||!requestId||!token){box.innerHTML='<p>This quote link is incomplete or the site is not connected yet.</p>';return}async function call(action){const r=await fetch(cfg.API_BASE_URL+'/accept-revised-quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId,acceptanceToken:token,action})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to load quote');return j}try{const q=await call('preview');box.innerHTML=`<p>Original estimate: <strong>$${q.previousTotal.toFixed(2)}</strong></p><div class="quote-total">$${q.revisedTotal.toFixed(2)}</div><p>Revised quote • expires ${new Date(q.expiresAt).toLocaleString()}</p><p>Your appointment remains pending until you accept the revised quote and complete payment after approval.</p><div class="hero-actions"><button id="accept" class="btn btn-primary">Accept Revised Quote</button><button id="decline" class="btn btn-secondary">Decline</button></div><p id="msg" class="tiny-note"></p>`;document.getElementById('accept').onclick=async()=>{try{const j=await call('accept');document.getElementById('msg').innerHTML=`Accepted. <a href="${j.paymentUrl}"><strong>Continue to secure payment</strong></a>.`}catch(e){document.getElementById('msg').textContent=e.message}};document.getElementById('decline').onclick=async()=>{if(!confirm('Decline this revised quote and release the appointment request?'))return;try{await call('decline');box.innerHTML='<h2>Request declined</h2><p>The pending appointment has been released.</p>'}catch(e){document.getElementById('msg').textContent=e.message}}}catch(e){box.innerHTML='<p>'+String(e.message).replace(/[&<>]/g,'')+'</p>'}})();
</script></body></html>
